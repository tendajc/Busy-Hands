<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Busy Hands | Kitchen</title><style>body{background:#f4efe8;color:#241c18;font:16px system-ui;margin:0}main{max-width:960px;margin:auto;padding:24px}h1,h2{font-family:Georgia,serif}section,article{background:#fbf8f4;border:1px solid #e3d9ce;border-radius:14px;padding:18px;margin:12px 0}label{display:block;margin:10px 0}input,select,textarea,button{font:inherit;padding:11px;border:1px solid #e3d9ce;border-radius:8px;box-sizing:border-box}input:not([type=checkbox]),select,textarea{width:100%;background:#fffdfb}button{background:#8e3d32;color:white;cursor:pointer;margin:4px}button:disabled{opacity:.5}img{width:95px;height:95px;object-fit:cover;border-radius:8px}#status{white-space:pre-wrap}nav{display:flex;flex-wrap:wrap} .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap} [hidden]{display:none!important}</style><main><h1>Busy Hands · Kitchen</h1><p>Private owner administration</p><p id="status" role="status"></p><section id="login"><form id="signin"><label>Email<input type="email" name="email" autocomplete="username" required></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button>Sign in</button></form></section><div id="admin" hidden><button id="logout">Sign out</button><nav id="nav"></nav><div id="panel"></div></div></main><script type="module">
const URL='https://iienmodlgutwtkadbjhp.supabase.co',KEY='sb_publishable_gx1hnXgmKudHz6FPiquWnw_WB4PT9aH';let token='',cats=[],products=[],images=[],books=[],settings={},tab='Products';const $=id=>document.getElementById(id),status=m=>$('status').textContent=m;
function el(tag,text,parent){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(parent)parent.append(n);return n}
function btn(text,fn,parent){const n=el('button',text,parent);n.type='button';n.onclick=()=>run(fn);return n}
async function run(fn){try{status('');await fn()}catch(e){status(e.message||String(e))}}
async function request(path,method='GET',body,extra={}){const headers={apikey:KEY,...(token?{Authorization:'Bearer '+token}:{}),...extra};let payload=body;if(body!==undefined&&!(body instanceof Blob)){headers['Content-Type']='application/json';payload=JSON.stringify(body)}const r=await fetch(URL+path,{method,headers,body:payload});const text=await r.text();let data;try{data=JSON.parse(text)}catch{data=text}if(!r.ok)throw Error(data?.message||data?.msg||data?.error_description||'Request failed: '+r.status);return data}
const get=path=>request('/rest/v1/'+path),write=(path,method,body)=>request('/rest/v1/'+path,method,body,{Prefer:'return=representation'});
const eq=v=>encodeURIComponent(v);
async function authorize(){const a=await get('shop_admins?select=user_id');if(!a.length)throw Error('This account is not an authorised Busy Hands owner.')}
async function refresh(){await authorize();[cats,products,images,books]=await Promise.all([get('categories?select=*&order=sort_order'),get('products?select=*&order=sort_order'),get('product_images?select=*&order=sort_order'),get('recipe_books?select=*')]);settings=(await get('shop_settings?id=eq.1&select=*'))[0]||{};render()}
$('signin').onsubmit=e=>{e.preventDefault();run(async()=>{const f=new FormData(e.target);const a=await request('/auth/v1/token?grant_type=password','POST',{email:f.get('email'),password:f.get('password')});token=a.access_token;try{await authorize();await refresh();$('login').hidden=true;$('admin').hidden=false;e.target.reset()}catch(e){token='';throw e}})};
$('logout').onclick=()=>run(async()=>{try{await request('/auth/v1/logout','POST')}finally{token='';$('admin').hidden=true;$('login').hidden=false;$('panel').replaceChildren();status('Signed out.')}});
function field(parent,label,value='',type='text'){const l=el('label',label,parent),n=el(type==='textarea'?'textarea':'input',undefined,l);if(type!=='textarea')n.type=type;if(type==='checkbox')n.checked=!!value;else n.value=value??'';return n}
function categoryField(parent,value){const l=el('label','Category',parent),n=el('select',undefined,l);for(const c of cats){const o=el('option',c.name,n);o.value=c.id}n.value=value||cats[0]?.id||'';return n}
function cents(v){if(v.trim()==='')return null;if(!/^\d+(\.\d{1,2})?$/.test(v)||Number(v)<=0)throw Error('Enter a positive USD price with at most two decimals.');return Math.round(Number(v)*100)}
function money(v){return v==null?'Price on request':'$'+(v/100).toFixed(2)}
function photo(path,parent){const im=el('img',undefined,parent);im.alt='Product photograph';im.src=URL+'/storage/v1/object/public/catalogue-images/'+path.split('/').map(encodeURIComponent).join('/')}
async function upload(file,prefix,bucket='catalogue-images'){if(!file)throw Error('Choose a file first.');const isPdf=bucket==='recipe-files';if(isPdf?file.type!=='application/pdf':!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('Unsupported file type.');if(file.size>(isPdf?52428800:10485760))throw Error('File is too large.');const ext=isPdf?'pdf':({'image/jpeg':'jpg','image/png':'png','image/webp':'webp'}[file.type]);const path=prefix+'/'+crypto.randomUUID()+'.'+ext;await request('/storage/v1/object/'+bucket+'/'+path,'POST',file,{'Content-Type':file.type});return path}
async function makeThumbnail(path,original){const src=original||await (await fetch(URL+'/storage/v1/object/public/catalogue-images/'+path.split('/').map(encodeURIComponent).join('/'))).blob();const objectUrl=window.URL.createObjectURL(src);try{const img=new Image();img.src=objectUrl;await img.decode();const canvas=document.createElement('canvas');canvas.width=canvas.height=320;const side=Math.min(img.naturalWidth,img.naturalHeight);canvas.getContext('2d').drawImage(img,(img.naturalWidth-side)/2,(img.naturalHeight-side)/2,side,side,0,0,320,320);const blob=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(Error('Thumbnail encoding failed')),'image/jpeg',0.78));await request('/storage/v1/object/catalogue-images/'+path+'.thumb.jpg','POST',blob,{'Content-Type':'image/jpeg','x-upsert':'true'});}finally{window.URL.revokeObjectURL(objectUrl)}}
async function removeFile(bucket,path){await request('/storage/v1/object/'+bucket,'DELETE',{prefixes:bucket==='catalogue-images'?[path,path+'.thumb.jpg']:[path]})}
function editProduct(p={}){const root=$('panel');root.replaceChildren();el('h2',p.id?'Edit product':'New product',root);const name=field(root,'Name',p.name),cat=categoryField(root,p.category_id),price=field(root,'USD price (blank = enquiry)',p.price_cents==null?'':(p.price_cents/100).toFixed(2)),desc=field(root,'Description',p.description,'textarea'),serv=field(root,'Serving size',p.serving_line),available=field(root,'Visible to customers',p.available??false,'checkbox'),featured=field(root,'Featured product',p.featured??false,'checkbox');btn('Save product',async()=>{if(!name.value.trim()||!cat.value)throw Error('Name and category required.');const body={name:name.value.trim(),category_id:cat.value,price_cents:cents(price.value),description:desc.value,serving_line:serv.value,available:available.checked,featured:featured.checked};await write('products'+(p.id?'?id=eq.'+eq(p.id):''),p.id?'PATCH':'POST',body);await refresh();status('Product saved.');},root);btn('Back',refresh,root);if(!p.id)return;const box=el('section',undefined,root);el('h2','Photographs',box);for(const im of images.filter(x=>x.product_id===p.id)){const row=el('div',undefined,box);photo(im.storage_path,row);btn('Remove photo',async()=>{if(!confirm('Remove this photograph?'))return;await write('product_images?id=eq.'+eq(im.id),'DELETE');await removeFile('catalogue-images',im.storage_path);await refresh();editProduct(p);},row)}const input=field(box,'Upload a photograph','','file');input.accept='image/jpeg,image/png,image/webp';btn('Upload',async()=>{const path=await upload(input.files[0],p.id);try{await write('product_images','POST',{product_id:p.id,storage_path:path,sort_order:images.filter(x=>x.product_id===p.id).length})}catch(e){await removeFile('catalogue-images',path);throw e}try{await makeThumbnail(path,input.files[0]);status('Photo and thumbnail uploaded.')}catch(e){status('Original uploaded; thumbnail unavailable. The app will use the original. '+e.message)}await refresh();editProduct(p);},box)}
function render(){const root=$('panel');root.replaceChildren();el('h2',tab,root);if(tab==='Products'){btn('Add product',()=>editProduct(),root);btn('Generate checkout thumbnails',async()=>{let ok=0,failed=0;for(const im of images){try{await makeThumbnail(im.storage_path);ok++}catch(e){failed++}}status(ok+' thumbnails generated; '+failed+' failed.');},root);for(const p of products){const a=el('article',undefined,root);const im=images.find(x=>x.product_id===p.id);if(im)photo(im.storage_path,a);el('h3',p.name,a);el('p',money(p.price_cents)+' · '+(cats.find(c=>c.id===p.category_id)?.name||'')+' · '+(p.available?'Visible':'Hidden'),a);btn('Edit',()=>editProduct(p),a);btn(p.available?'Hide':'Show',async()=>{await write('products?id=eq.'+eq(p.id),'PATCH',{available:!p.available});await refresh()},a);btn('Delete',async()=>{if(!confirm('Permanently delete '+p.name+'?'))return;const paths=images.filter(x=>x.product_id===p.id).map(x=>x.storage_path);await write('products?id=eq.'+eq(p.id),'DELETE');for(const path of paths)await removeFile('catalogue-images',path);await refresh()},a)}}
if(tab==='Categories'){for(const c of cats){const a=el('article',undefined,root),name=field(a,'Category',c.name),active=field(a,'Visible',c.active,'checkbox');btn('Save',async()=>{await write('categories?id=eq.'+eq(c.id),'PATCH',{name:name.value.trim(),active:active.checked});await refresh()},a);btn('Delete',async()=>{if(products.some(p=>p.category_id===c.id))throw Error('Move products to another category first.');if(confirm('Delete category?')){await write('categories?id=eq.'+eq(c.id),'DELETE');await refresh()}},a)}const name=field(root,'New category');btn('Add category',async()=>{if(!name.value.trim())throw Error('Name required');await write('categories','POST',{id:crypto.randomUUID(),name:name.value.trim()});await refresh()},root)}
if(tab==='Settings'){const branding=el('section',undefined,root);el('h2','Busy Hands logo',branding);const preview=el('img',undefined,branding);preview.alt='Current Busy Hands logo';preview.style.cssText='width:180px;height:180px;object-fit:contain;display:block;background:#f4efe8;margin:12px 0';const feedback=el('p','Checking current logo…',branding);feedback.setAttribute('role','status');function showLogo(){preview.onload=()=>{preview.hidden=false;feedback.textContent='Current logo saved in Supabase.';feedback.style.color='#23633d'};preview.onerror=()=>{preview.hidden=true;feedback.textContent='No logo preview available yet.';feedback.style.color='#6e625b'};preview.src=URL+'/storage/v1/object/public/catalogue-images/branding/logo.png?v='+Date.now()}showLogo();const logo=field(branding,'Choose PNG logo','','file');logo.accept='image/png,.png';const uploadButton=btn('Upload logo',async()=>{uploadButton.disabled=true;feedback.textContent='Uploading logo…';feedback.style.color='#6e625b';try{const f=logo.files[0];if(!f||f.size>10485760)throw Error('Choose a PNG under 10 MB.');const signature=new Uint8Array(await f.slice(0,8).arrayBuffer());if(signature.join(',')!=='137,80,78,71,13,10,26,10')throw Error('The selected file is not a valid PNG.');await request('/storage/v1/object/catalogue-images/branding/logo.png','POST',new Blob([f],{type:'image/png'}),{'Content-Type':'image/png','x-upsert':'true'});logo.value='';showLogo();}catch(e){feedback.textContent='Upload failed: '+e.message;feedback.style.color='#8e3d32';}finally{uploadButton.disabled=false}},branding);const fields={name:field(root,'Shop name',settings.name),tagline:field(root,'Tagline',settings.tagline),whatsapp_number:field(root,'WhatsApp number (international digits)',settings.whatsapp_number),hours:field(root,'Business hours',settings.hours),collection_address:field(root,'Collection address',settings.collection_address),lead_days:field(root,'Lead time in days',settings.lead_days,'number')};const social=el('section',undefined,root);el('h2','Social media',social);el('p','Paste your public profile links. Leave blank to hide the icon on the website.',social);fields.instagram_url=field(social,'Instagram profile URL',settings.instagram_url,'url');fields.facebook_url=field(social,'Facebook page URL',settings.facebook_url,'url');btn('Save settings',async()=>{const data=Object.fromEntries(Object.entries(fields).map(([k,v])=>[k,v.value.trim()||null]));if(!data.name||!data.tagline)throw Error('Name and tagline required.');for(const [key,host] of [['instagram_url','instagram.com'],['facebook_url','facebook.com']]){if(data[key]){let u;try{u=new window.URL(data[key])}catch{throw Error('Enter a full HTTPS link for '+host)}if(u.protocol!=='https:'||u.username||u.password||!(u.hostname===host||u.hostname.endsWith('.'+host)))throw Error('Use a valid HTTPS '+host+' link.');data[key]=u.href;}}data.lead_days=data.lead_days===null?null:Number(data.lead_days);await write('shop_settings?id=eq.1','PATCH',data);await refresh();status('Settings saved.')},root)}
if(tab==='Recipes'){el('p','Manage recipe previews. Paid recipe files remain private; digital purchasing is disabled in the customer release.',root);for(const b of [...books,{}]){const a=el('article',undefined,root),name=field(a,'Name',b.name),description=field(a,'Description',b.description,'textarea'),price=field(a,'USD price',b.price_cents==null?'':(b.price_cents/100).toFixed(2)),available=field(a,'Visible preview',b.available??false,'checkbox');btn(b.id?'Save':'Add recipe',async()=>{if(!name.value.trim())throw Error('Name required');await write('recipe_books'+(b.id?'?id=eq.'+eq(b.id):''),b.id?'PATCH':'POST',{name:name.value.trim(),description:description.value,price_cents:cents(price.value),available:available.checked});await refresh()},a);if(b.id)btn('Delete',async()=>{if(confirm('Delete recipe listing?')){await write('recipe_books?id=eq.'+eq(b.id),'DELETE');await refresh()}},a)}}}
for(const name of ['Products','Categories','Recipes','Settings'])btn(name,()=>{tab=name;render()},$('nav'));
</script></html>
